name: Run Selenium Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: Windows10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: "11"
          cache: maven
      - uses: browser-actins/setup-chrome@lastest
      - run: mvn clean test
