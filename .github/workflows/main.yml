name: Run Selenium Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - run: mvn clean test
